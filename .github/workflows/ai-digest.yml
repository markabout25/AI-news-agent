name: AI News Digest

on:
  schedule:
    - cron: "*/10 * * * *"   # TESTING: every 10 min — change to "0 8 */2 * *" when confirmed working
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent (fetch + summarize + email)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: markalexanderreich@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python agent.py

      - name: Commit digest
        run: |
          git config user.name "AI Digest Bot"
          git config user.email "actions@github.com"
          git add summaries/
          git diff --staged --quiet || git commit -m "digest: $(date +'%Y-%m-%d')"
          git push
